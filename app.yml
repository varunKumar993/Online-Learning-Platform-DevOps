- name: Configure and deploy application servers
  hosts: app_servers
  become: true
  vars:
    db_name: olp_db
    db_user: olp_user
    db_password: "ChangeMe_123"
  tasks:
    - name: Install Docker, Nginx, PostgreSQL client
      apt: { name: [docker.io, nginx, postgresql-client], state: present, update_cache: true }

    - name: Start Docker
      service: { name: docker, state: started, enabled: true }

    - name: Allow ubuntu user to run docker
      user: { name: ubuntu, groups: docker, append: true }

    - name: App directory
      file: { path: /opt/olp, state: directory }

    - name: Database connection settings for the app
      copy:
        dest: /opt/olp/app.env
        mode: "0600"
        content: |
          DB_HOST={{ db_private_ip }}
          DB_PORT=5432
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}

    - name: Copy app files
      copy: { src: "{{ playbook_dir }}/{{ item }}", dest: "/opt/olp/{{ item }}" }
      loop: [index.html, Dockerfile]

    - name: Build Docker image
      command: docker build -t olp-app:latest /opt/olp

    - name: Run container (replace old one)
      shell: |
        docker rm -f olp || true
        docker run -d --name olp --restart always --env-file /opt/olp/app.env -p 127.0.0.1:8081:80 olp-app:latest
      args: { executable: /bin/bash }

    - name: Nginx reverse proxy to the container
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80;
              server_name _;
              location / {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }

    - name: Validate Nginx config
      command: nginx -t
      changed_when: false

    - name: Start Nginx
      service: { name: nginx, state: restarted, enabled: true }

    - name: Verify DB connectivity from app server
      shell: >
        PGPASSWORD='{{ db_password }}' psql -h {{ db_private_ip }}
        -U {{ db_user }} -d {{ db_name }} -c 'SELECT 1;'
      register: dbcheck
      changed_when: false

    - name: Show DB check result
      debug: var=dbcheck.stdout_lines
